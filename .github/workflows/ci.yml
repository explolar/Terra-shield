name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend & geo-engine (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./geo-engine[dev]
          pip install ./backend[dev]
      - name: Lint (ruff, non-blocking)
        run: ruff check backend/app geo-engine/terrashield_geo || true
      - name: Test geo-engine
        run: pytest geo-engine/tests -q
      - name: Test backend
        run: pytest backend/tests -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
