# Cloud Build config — TerraShield backend image.
# `gcloud builds submit` has no --file flag, so we drive `docker build -f` here to
# use the non-default infra/backend.Dockerfile.
#
# Usage (from repo root):
#   gcloud builds submit --config infra/cloudbuild.backend.yaml \
#     --substitutions=_IMAGE=$REGION-docker.pkg.dev/$RUN_PROJECT/terrashield/backend .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "infra/backend.Dockerfile", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
# ML wheels (scikit-learn / shap / xgboost) + earthengine-api can exceed the
# default 10-minute build timeout on a small machine.
timeout: 1200s
options:
  machineType: E2_HIGHCPU_8
