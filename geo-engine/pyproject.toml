[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrashield-geo"
version = "0.1.0"
description = "EarthData Engine — geospatial compute library for TerraShield AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# Core deps are intentionally light so the package imports without GEE.
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# Live Earth Engine data. Without these, the engine runs in DEMO mode.
gee = ["earthengine-api>=0.1.390"]
# Statistics for SPI / distribution fitting.
stats = ["scipy>=1.11"]
dev = ["pytest>=7", "pytest-cov"]
full = ["terrashield-geo[gee,stats]"]

[tool.setuptools.packages.find]
include = ["terrashield_geo*"]

[tool.setuptools.package-data]
terrashield_geo = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
