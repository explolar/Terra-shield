[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrashield-geo"
version = "0.1.0"
description = "EarthData Engine — geospatial compute library for TerraShield AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# Core deps are intentionally light so the package imports without GEE.
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# Live Earth Engine data. Without these, the engine runs in DEMO mode.
gee = ["earthengine-api>=0.1.390"]
# Statistics for SPI / distribution fitting.
stats = ["scipy>=1.11"]
# Graph analytics for InfraRisk road-network criticality (/infra/criticality).
graph = ["networkx>=3.0"]
# ML flood risk (/flood/ml-risk) — heavier; needs libgomp1 at runtime (see Dockerfile).
ml = ["scikit-learn>=1.3", "shap>=0.44", "xgboost>=2.0"]
# Everything the production backend needs for all live endpoints EXCEPT ML.
# httpx powers the Overpass (OSM roads) calls in roads.py.
serve = ["earthengine-api>=0.1.390", "scipy>=1.11", "networkx>=3.0", "httpx>=0.27"]
dev = ["pytest>=7", "pytest-cov", "scipy>=1.11", "networkx>=3.0",
       "scikit-learn>=1.3", "shap>=0.44"]
# Absolutely everything (live + ML).
full = ["terrashield-geo[gee,stats,graph,ml]"]

[tool.setuptools.packages.find]
include = ["terrashield_geo*"]

[tool.setuptools.package-data]
terrashield_geo = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
